# openspec/config.yaml
schema: spec-driven

context: |
  Producto: visualizador de ejecucion paso a paso de Java para bachillerato (sin experiencia previa), en espanol de Mexico.
  Stack: Vite 8 + React 19 + TypeScript 6 estricto; SPA estatica publicable en GitHub Pages; cero CDNs en runtime.
  Motor: interprete de subconjunto de Java (curriculo U3-U7) en TypeScript puro, corre en un Web Worker del navegador.
  Fidelidad: comportamiento identico a Java 17; JDK 17 real (Temurin 17.0.18+8) en /Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home/bin/ para el oraculo diferencial.
  Pruebas instaladas y en uso: Vitest 5 + Testing Library + jsdom (unit/integration, proyectos motor/interfaz), Playwright 1.63 (E2E Chromium/Firefox/WebKit), oraculo diferencial contra JDK 17 real.
  Estado: lote 0 (cimientos + rebanada vertical) en cierre — tareas 0.1-0.15 hechas, commits reales en main, sdd-init refrescado en 0.16.

strict_tdd: true

rules:
  proposal:
    - Incluir plan de rollback para cambios riesgosos
    - Identificar módulos/paquetes afectados
  specs:
    - Usar formato Given/When/Then para escenarios
    - Usar palabras clave RFC 2119 (MUST, SHALL, SHOULD, MAY)
    - Cada comportamiento del intérprete se respalda con una prueba diferencial contra el JDK 17 real
  design:
    - Incluir diagramas de secuencia para flujos complejos
    - Documentar decisiones de arquitectura con justificación
    - Cero dependencias de red en tiempo de ejecución — ninguna decisión de arquitectura puede introducir una CDN o llamada externa
  tasks:
    - Agrupar tareas por fase (infraestructura, implementación, pruebas)
    - Numeración jerárquica (1.1, 1.2, etc.)
    - Tareas completables en una sola sesión
  apply:
    notes:
      - Seguir los patrones y convenciones existentes del proyecto
      - Cargar skills de codificación relevantes para el stack
      - Todo texto visible u oíble por el usuario en español de México
      - Lo que el subconjunto de Java no soporta se reporta con un aviso claro en español; nunca resultados inventados
      - Cero dependencias de red en tiempo de ejecución
      - Conventional commits SIN atribución de IA (sin Co-Authored-By); pedir confirmación explícita al usuario antes de cada commit
      - Salidas de pruebas y linters acotadas (--reporter=dot, --silent/--quiet)
    test_command: "npm test"
  verify:
    notes:
      - Ejecutar pruebas si existe infraestructura de pruebas
      - Comparar la implementación contra cada escenario del spec, incluidas las pruebas diferenciales contra JDK 17
      - Salidas de pruebas y linters acotadas (--reporter=dot, --silent/--quiet)
    test_command: "npm test"
    build_command: ""
    coverage_threshold: 0
  archive:
    - Advertir antes de fusionar deltas destructivos (eliminaciones grandes)

testing:
  detected: 2026-09-25
  test_runner:
    command: "npm test"
    framework: "Vitest 5.0.2 (proyectos `motor` en Node y `interfaz` en jsdom, --reporter=dot)"
    oracle_command: "npm run test:oraculo"  # proyecto Vitest `oraculo`: herramientas/oraculo/** con el JDK 17 real; corre en oraculo.yml (tarea 0.18)
  layers:
    unit:
      available: true
      tool: "Vitest 5.0.2 — proyecto `motor` (entorno node: src/motor, src/textos, src/presentacion, src/trabajador, herramientas/ salvo herramientas/oraculo, pruebas/)"
    integration:
      available: true
      tool: "Vitest 5.0.2 — proyecto `interfaz` (entorno jsdom) + @testing-library/react 16.3.3 + @testing-library/user-event 14.6.7"
    e2e:
      available: true
      tool: "Playwright 1.63.0 — chromium/firefox/webkit (`npm run e2e`, --reporter=dot); proyecto `navegadores` de Vitest con @vitest/browser-playwright llega en la tarea 2.22"
  coverage:
    available: true
    command: "npx vitest run --coverage"
    note: "@vitest/coverage-v8 5.0.2 instalado; sin script npm dedicado ni bloque coverage en vitest.config.ts todavía"
  quality:
    linter:
      available: true
      command: "npm run lint"
    type_checker:
      available: true
      command: "npm run tipos"
    formatter:
      available: false
      command: ""
  extra:
    oraculo_diferencial:
      available: true
      command: "npm run oraculo:verificar"
      note: "compara contra JDK 17 real (Temurin 17.0.18+8, REQ-DIFF-*); ver también oraculo:goldens, oraculo:datos, oraculo:mutantes, oraculo:generados"
    accesibilidad:
      available: true
      tool: "@axe-core/playwright 4.13.0"
    pruebas_por_propiedades:
      available: true
      tool: "fast-check 4.10.2"
    ci_local:
      command: "npm run ci"
      note: "lint + tipos + test + build + presupuesto + licencias"
