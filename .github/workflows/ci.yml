name: CI

# Flujo principal (design.md §9): cada push/PR a main. ubuntu-latest, Node fijado por .nvmrc.
#
# "CI al día con lo que existe" (orquestador, 2026-09-25 — tasks.md → Convenciones): un workflow
# solo invoca scripts y suites que ya existen, para que el CI remoto esté verde de verdad en cada
# cierre de lote, sin `continue-on-error` ni pasos vacíos. Estado al cerrar el lote 0 (sub-lote 0-C):
#   - `npm run ci` (composite: lint+tipos+test+build+presupuesto+licencias, design.md §9) TODAVÍA no
#     se puede llamar de un solo golpe: encadena `presupuesto` (`herramientas/presupuesto-tamano.ts`),
#     que crea el lote 5. Abajo van sus pasos reales por separado (lint, tipos, test, build,
#     licencias) — quien cierre el lote 5 los vuelve a colapsar en un solo `npm run ci`.
#   - `test:navegadores` (proyecto Vitest en Chromium/Firefox/WebKit reales) lo crea la tarea 2.22.
#   - `rendimiento` (Playwright, umbral holgado) lo crea la tarea 3.8.
#   - `e2e` YA es real desde la tarea 0.15: rebanada vertical `u3-hola-mundo` en los tres motores.
#   - Tarea 0.18 (tras el primer CI remoto): este job corre SIN JDK (ADR 011 punto 4) — `npm test`
#     (proyectos Vitest `motor`+`interfaz`) YA NO incluye `herramientas/oraculo/**` (proyecto
#     `oraculo` aparte, vitest.config.ts); esas pruebas, que SIEMPRE requieren el JDK real, corren
#     solo en `oraculo.yml` vía `npm run test:oraculo`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Node (versión de .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Instalar dependencias (reproducible, package-lock.json)
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps

      - name: Lint (eslint . --quiet)
        run: npm run lint

      - name: Tipos (tsc por cada una de las 4 capas)
        run: npm run tipos

      - name: Pruebas (Vitest — proyectos motor + interfaz, --reporter=dot)
        run: npm test

      - name: Build de producción (valida que compile; BASE_PUBLICA real solo en desplegar.yml)
        run: npm run build

      - name: Licencias (audita dependencias permisivas)
        run: npm run licencias

      # `--reporter=dot,html`: la terminal sigue con `dot` (CLAUDE.md regla 9) y además queda el
      # reporte HTML en `playwright-report/` para el artefacto de abajo (con CI=true nunca se abre
      # ni se queda esperando).
      - name: End-to-end (Playwright ×3 motores — rebanada vertical desde la tarea 0.15)
        run: npm run e2e -- --reporter=dot,html

      # Diagnóstico permanente (corrección del E2E de Firefox en CI, PR #1): el primer fallo remoto
      # llegó sin traza, captura ni `error-context.md`. Si algo falla, se suben trazas, capturas y
      # el reporte HTML de Playwright (`playwright.config.ts` → trace/screenshot solo en fallos).
      - name: Publicar trazas y capturas de Playwright (solo si el job falla)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-intento-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
