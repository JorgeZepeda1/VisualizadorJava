name: Desplegar

# Publica en GitHub Pages (design.md §9, ADR 014). P1 ya resuelta (2026-09-25): repositorio público
# JorgeZepeda1/VisualizadorJava → BASE_PUBLICA=/VisualizadorJava/ (ya no un marcador de posición).
# El build con esa ruta base se probó en tres navegadores (hito 3, tarea 5.12): `pruebas/e2e/despliegue.spec.ts`
# construye con la MISMA variable y prueba la carga, el trabajador, el service worker y el modo sin red.
# Después de publicar, la misma prueba corre contra la URL real:
#   URL_DESPLEGADA=https://jorgezepeda1.github.io/VisualizadorJava/ npm run e2e -- despliegue
#
# Antes del PRIMER despliegue (una sola vez, en el repositorio):
#   1. Settings → Pages → Build and deployment → Source: «GitHub Actions».
#   2. Settings → Environments → github-pages → Deployment branches and tags: agregar la regla de
#      ETIQUETA `v*`. El entorno suele crearse permitiendo sólo la rama por omisión, y entonces un
#      despliegue disparado por una etiqueta falla con «Tag … is not allowed to deploy to github-pages
#      due to environment protection rules» (si ya permite etiquetas, el paso no estorba).
#
# Revertir una versión: volver a ejecutar este flujo manualmente (Actions → Desplegar → Run workflow,
# desde `main`) con `ref` apuntando a la etiqueta anterior (propuesta §11) — Pages sirve lo último
# desplegado, nunca hace falta "deshacer" un commit. Los alumnos con la versión nueva en caché ven el
# aviso «Hay una versión nueva» (tarea 5.7) y vuelven a la anterior al recargar.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Etiqueta o rama a desplegar (para revertir, usa la etiqueta anterior)'
        required: true
        default: 'main'

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue de Pages a la vez; nunca cancelar uno a medias (podría dejar el sitio servido
# a medio publicar).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Node (versión de .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Instalar dependencias (reproducible, package-lock.json)
        run: npm ci

      - name: Build de producción con la ruta base real de Pages (P1)
        run: BASE_PUBLICA=/VisualizadorJava/ npm run build

      # Tarea 5.9 (REQ-PLAT-003): no se publica un sitio que pese más de 500 KB comprimidos.
      - name: Presupuesto de carga (≤ 500 KB comprimidos)
        run: npm run presupuesto

      - name: Empaquetar el artefacto de Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
