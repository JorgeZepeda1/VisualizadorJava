name: Oráculo

# Job dedicado del arnés diferencial (ADR 010/011, design.md §9). Corre en macOS arm64 con el JDK
# de referencia exacto (Temurin 17.0.18+8) — nunca en el flujo principal (ci.yml), que compara
# goldens ya escritos SIN necesitar el JDK (design.md §7.2). Los minutos de macOS cuestan más si
# el repositorio es privado (P1: público desde 2026-09-25, JorgeZepeda1/VisualizadorJava): por eso
# el disparo es solo por cambios relevantes, nocturno, o manual — nunca en cada push a cualquier
# archivo.
#
# "CI al día con lo que existe" (orquestador, 2026-09-25 — tasks.md → Convenciones): al cerrar el
# lote 0 (sub-lote 0-C), `oraculo:generados` (fuzzing nocturno contra el JDK, tarea 2.21) y
# `oraculo:mutantes` (veredictos de mutantes, tarea 1.16) TODAVÍA no existen como scripts reales —
# solo `oraculo:verificar` (tarea 0.6) corre hoy. Los pasos nocturnos se agregan de vuelta cuando
# esas tareas creen sus scripts.

on:
  push:
    paths:
      - 'corpus/**'
      - 'herramientas/oraculo/**'
      - 'src/motor/biblioteca/datos/**'
  pull_request:
    paths:
      - 'corpus/**'
      - 'herramientas/oraculo/**'
      - 'src/motor/biblioteca/datos/**'
  schedule:
    # 08:00 UTC ≈ 02:00 hora del centro de México (sin horario de verano) — corrida nocturna.
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  oraculo:
    runs-on: macos-14
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Node (versión de .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: JDK 17 real de referencia (Temurin 17.0.18+8, ADR 011)
        id: jdk
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17.0.18+8'

      - name: Instalar dependencias (reproducible, package-lock.json)
        run: npm ci

      - name: Verificar goldens contra una regeneración real (bytes idénticos, ADR 011 punto 4)
        env:
          JDK17_HOME: ${{ steps.jdk.outputs.path }}
        run: npm run oraculo:verificar

      # Pasos nocturnos pendientes — se agregan cuando sus tareas creen los scripts reales:
      #   - Fuzzing contra el JDK real (C3): npm run oraculo:generados — tarea 2.21.
      #   - Regenerar veredictos de mutantes (C7): npm run oraculo:mutantes — tarea 1.16.
