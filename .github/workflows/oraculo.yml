name: Oráculo

# Job dedicado del arnés diferencial (ADR 010/011, design.md §9). Corre en macOS arm64 con el JDK
# de referencia exacto (Temurin 17.0.18+8) — nunca en el flujo principal (ci.yml), que compara
# goldens ya escritos SIN necesitar el JDK (design.md §7.2). Los minutos de macOS cuestan más si
# el repositorio es privado (P1: público desde 2026-09-25, JorgeZepeda1/VisualizadorJava): por eso
# el disparo es solo por cambios relevantes, nocturno, o manual — nunca en cada push a cualquier
# archivo.
#
# "CI al día con lo que existe" (orquestador, 2026-09-25 — tasks.md → Convenciones):
# - `oraculo:mutantes` (veredictos de mutantes, tarea 1.16, sub-lote 1-D3): su paso nocturno regenera y
#   compara bytes, mismo patrón que "Catálogo de datos del JDK" de abajo.
# - `oraculo:generados` (generador diferencial de programas contra javac 17, tarea 1.31): en PR y en
#   push corre con SEMILLA FIJA y pocos programas (cabe en pocos minutos, y es reproducible: si falla, la
#   misma semilla y cantidad lo reproducen en cualquier máquina); de noche y a mano corre con MÁS programas y
#   una semilla que cambia cada día (la fecha), para explorar programas nuevos. Sale con código ≠ 0 ante
#   cualquier discrepancia entre `compilar()` y javac; el informe JSON (familias y programas mínimos) se
#   sube como artefacto cuando falla. La tarea 2.21 lo extiende a la EJECUCIÓN (salida y excepciones).
#   Como compara EL COMPILADOR con javac, cualquier cambio en `src/motor/**` dispara este flujo (ver `paths`).
#
# Tarea 0.18 (tras el primer CI remoto): `ci.yml` (ubuntu-latest, SIN JDK) fallaba porque `npm
# test` corría también las pruebas de `herramientas/oraculo/**`, que SIEMPRE requieren el JDK real
# (ADR 011 punto 4: "npm test compara sin JDK"). Ahora esas pruebas viven en su propio proyecto de
# Vitest (`oraculo`, ver vitest.config.ts) y SOLO corren aquí, con el JDK real, vía `test:oraculo`
# — antes de `oraculo:verificar`, para fallar rápido si algo del arnés mismo está roto.

on:
  push:
    paths:
      - 'corpus/**'
      - 'herramientas/oraculo/**'
      - 'src/motor/**'
  pull_request:
    paths:
      - 'corpus/**'
      - 'herramientas/oraculo/**'
      - 'src/motor/**'
  schedule:
    # 08:00 UTC ≈ 02:00 hora del centro de México (sin horario de verano) — corrida nocturna.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      semilla:
        description: 'Semilla del generador diferencial (vacío: la fecha de hoy, AAAAMMDD)'
        required: false
      cantidad:
        description: 'Programas que genera el generador diferencial (vacío: 40000)'
        required: false

jobs:
  oraculo:
    runs-on: macos-14
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Node (versión de .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: JDK 17 real de referencia (Temurin 17.0.18+8, ADR 011)
        id: jdk
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17.0.18+8'

      - name: Instalar dependencias (reproducible, package-lock.json)
        run: npm ci

      - name: Pruebas del oráculo (Vitest — proyecto oraculo, requiere el JDK real; tarea 0.18)
        env:
          JDK17_HOME: ${{ steps.jdk.outputs.path }}
        run: npm run test:oraculo

      - name: Verificar goldens contra una regeneración real (bytes idénticos, ADR 011 punto 4)
        env:
          JDK17_HOME: ${{ steps.jdk.outputs.path }}
        run: npm run oraculo:verificar

      - name: Catálogo de datos del JDK contra una regeneración real (bytes idénticos, ADR 010 punto 3; tarea 1.9)
        env:
          JDK17_HOME: ${{ steps.jdk.outputs.path }}
        run: |
          npm run oraculo:datos
          git diff --exit-code -- corpus/datos src/motor/biblioteca/datos || {
            echo '::error::corpus/datos/** o src/motor/biblioteca/datos/**.generado.ts no coinciden con una regeneración real contra el JDK (ADR 010). Corre "npm run oraculo:datos" localmente y confirma los cambios.' >&2
            exit 1
          }

      # Nocturno (design.md §9: "de noche, oraculo:generados y oraculo:mutantes") — semilla FIJA
      # (mutantes.ts), así que una regeneración real de una noche sin cambios en corpus/curso ni en
      # el generador debe dar BYTES IDÉNTICOS (mismo criterio que "Catálogo de datos del JDK"
      # arriba, ADR 010 punto 3) — si difiere, alguien cambió el corpus o el generador sin
      # regenerar `corpus/mutantes/veredictos.jsonl` localmente primero.
      - name: 'Nocturno: regenerar veredictos de mutantes contra una regeneración real (C7, tarea 1.16)'
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          JDK17_HOME: ${{ steps.jdk.outputs.path }}
        run: |
          npm run oraculo:mutantes
          git diff --exit-code -- corpus/mutantes || {
            echo '::error::corpus/mutantes/veredictos.jsonl no coincide con una regeneración real contra el JDK (ADR 010, semilla fija de mutantes.ts). Corre "npm run oraculo:mutantes" localmente y confirma los cambios.' >&2
            exit 1
          }

      # Generador diferencial (tarea 1.31, design.md §9): programas generados del subconjunto, compilados
      # con javac 17 real y con `compilar()`; cualquier discrepancia falla el paso. En PR y en push: semilla
      # FIJA y 3 000 programas (unos 30 s cuando no hay discrepancias; `--max-reducir` acota el tiempo si
      # las hay). Cada familia de discrepancia se reduce al programa mínimo que la conserva.
      - name: 'Generador diferencial (PR y push): 3 000 programas con semilla fija contra javac (tarea 1.31)'
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        timeout-minutes: 15
        env:
          JDK17_HOME: ${{ steps.jdk.outputs.path }}
        run: npm run oraculo:generados -- --semilla 20260929 --cantidad 3000 --max-reducir 100 --salida test-results/oraculo-generados-pr.json

      # De noche y a mano: más programas y una semilla que cambia cada día (o la que se pida al lanzarlo).
      - name: 'Nocturno: generador diferencial con más programas y semilla del día (tarea 1.31)'
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 45
        env:
          JDK17_HOME: ${{ steps.jdk.outputs.path }}
          SEMILLA_PEDIDA: ${{ inputs.semilla }}
          CANTIDAD_PEDIDA: ${{ inputs.cantidad }}
        run: |
          SEMILLA="${SEMILLA_PEDIDA:-$(date -u +%Y%m%d)}"
          CANTIDAD="${CANTIDAD_PEDIDA:-40000}"
          echo "Semilla $SEMILLA, $CANTIDAD programas (reproducible: npm run oraculo:generados -- --semilla $SEMILLA --cantidad $CANTIDAD)"
          npm run oraculo:generados -- --semilla "$SEMILLA" --cantidad "$CANTIDAD" --max-reducir 300 --salida test-results/oraculo-generados-noche.json

      # Diagnóstico permanente: el informe JSON trae cada familia con su programa mínimo, el mensaje de
      # javac y lo que respondió nuestro compilador; sin él, un fallo remoto solo deja el resumen del log.
      - name: Publicar el informe del generador diferencial (solo si el job falla)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: oraculo-generados-intento-${{ github.run_attempt }}
          path: test-results/oraculo-generados-*.json
          if-no-files-found: ignore
          retention-days: 14
